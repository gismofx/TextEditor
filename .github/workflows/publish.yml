name: Publish NuGet Package

on:
  release:
    types: [published]   # GitHub web UI: Releases -> Draft new release -> Publish
  workflow_dispatch:     # Or run by hand from the Actions tab
    inputs:
      version:
        # Deliberately no default: a pre-filled version is how a run silently re-packs an
        # already-published version, which --skip-duplicate then turns into a green no-op.
        description: 'Package version to publish (e.g. 1.2.1)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for NuGet trusted publishing (OIDC)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      # Both SDKs, because the library multi-targets net8.0;net10.0.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      # A release supplies the version through the tag (v1.2.1 -> 1.2.1); a manual run supplies
      # it as an input. Either way the version comes from outside the csproj, so a release never
      # silently ships whatever number happened to be committed.
      - name: Extract version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Pack
        run: >
          dotnet pack src/Blazored.TextEditor/Blazored.TextEditor.csproj
          -c Release
          -p:PackageVersion=${{ steps.version.outputs.VERSION }}
          --output ./nupkg

      # Prove the deliverable is intact before it is public: an unlisted-and-replaced version is
      # the only remedy afterwards.
      - name: Verify package contents
        run: |
          set -e
          pkg=$(ls ./nupkg/*.nupkg)
          echo "Inspecting $pkg"
          unzip -l "$pkg"
          for entry in \
            lib/net8.0/Blazored.TextEditor.dll \
            lib/net10.0/Blazored.TextEditor.dll \
            staticwebassets/Blazored-BlazorQuill.js \
            staticwebassets/quill-blot-formatter.min.js
          do
            unzip -l "$pkg" | grep -q "$entry" || { echo "MISSING FROM PACKAGE: $entry"; exit 1; }
          done
          echo "All expected entries present."
          # The base path is a contract with every consumer: StaticWebAssetBasePath REPLACES the
          # whole default, so a value missing the _content/ prefix serves the JS somewhere no
          # consuming index.html looks. 1.2.0 and 1.2.1 both shipped that way.
          unzip -p "$pkg" build/Microsoft.AspNetCore.StaticWebAssets.props | grep -q "<BasePath>_content/Blazored.TextEditor</BasePath>" || { echo "WRONG BASE PATH in the package - expected _content/Blazored.TextEditor"; exit 1; }
          echo "Base path correct."

      # Trusted publishing: no API key is stored in this repo. It requires a policy on
      # nuget.org for this owner, this repository and this workflow file - without one, this
      # step fails and nothing is pushed.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: gismofx

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

      # A successful push step is NOT evidence that this version reached nuget.org:
      # --skip-duplicate reports success when the version already existed, so a run with the
      # wrong version input looks identical to a real publish. Ask the far side.
      - name: Confirm the version is live on nuget.org
        run: |
          set -e
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "Waiting for CPE.BlazorQuill $VERSION to appear..."
          for i in $(seq 1 20); do
            if curl -s https://api.nuget.org/v3-flatcontainer/cpe.blazorquill/index.json | grep -q "\"$VERSION\""; then
              echo "Live on nuget.org: $VERSION"
              exit 0
            fi
            sleep 15
          done
          echo "NOT PUBLISHED: $VERSION never appeared on nuget.org after 5 minutes."
          echo "Most likely the version input names a version that already exists, which --skip-duplicate silently skips."
          exit 1
