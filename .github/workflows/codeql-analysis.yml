name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # JavaScript matters more than C# here: this library is a wrapper, and the surface worth
        # scanning is what it writes into and reads back out of the Quill editor.
        language: [ 'csharp', 'javascript-typescript' ]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # C# is analysed from a real build, so the SDKs must cover the library's target frameworks.
      # Autobuild is deliberately not used: it builds the whole solution, and the three sample
      # apps here target net9.0 - which is exactly what left this workflow red.
      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Build library
        if: matrix.language == 'csharp'
        run: dotnet build src/Blazored.TextEditor/Blazored.TextEditor.csproj -c Release

      # JavaScript needs no build step - CodeQL reads the sources directly.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
